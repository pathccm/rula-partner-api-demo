                    - const: children
                      description: Children (ages 5-7)
                    - const: minors
                      description: Minors (ages 13-17)
                    - const: preteen
                      description: Preteen (ages 8-12)
                    - const: individuals
                      description: Individual therapy
                    - const: couples
                      description: Couples therapy
                    - const: families
                      description: Family therapy
              genders:
                description: The gender identities of the provider
                type: array
                items:
                  type: string
              races:
                description: The racial or ethnic identities of the provider
                type: array
                items:
                  type: string
              languages:
                description: The languages spoken by the provider
                type: array
                items:
                  type: string
              specializations:
                description: The specializations of the provider
                type: array
                items:
                  type: string
              modalities:
                description: The therapeutic modalities practiced by the provider
                type: array
                items:
                  type: string
            required:
              - id
              - first_name
              - last_name
            additionalProperties: false
    ProvidersSlotsResponse:
      description: Default Response
      content:
        application/json:
          schema:
            type: object
            properties:
              slots:
                description: List of slots available for the provider
                type: array
                items:
                  type: object
                  properties:
                    provider_id:
                      description: The unique Rula-provided identifier for the provider
                      allOf:
                        - $ref: "#/components/schemas/Uuid"
                    duration_mins:
                      description: Duration of the slot in minutes
                      type: integer
                      exclusiveMinimum: 0
                      maximum: 9007199254740991
                      example: 45
                    location:
                      description: The location type of the slot
                      type: string
                      enum:
                        - in_person
                        - telemedicine
                    series_type:
                      description: Whether the slot is for a first appointment ("initial") or a subsequent session ("followup").
                      type: string
                      enum:
                        - initial
                        - followup
                    start_time_iso:
                      description: The ISO 8601 formatted start time of the slot
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      example: 2024-01-15T10:00:00Z
                  required:
                    - provider_id
                    - duration_mins
                    - location
                    - series_type
                    - start_time_iso
                  additionalProperties: false
            required:
              - slots
            additionalProperties: false
  schemas:
    Appointment:
      type: object
      properties:
        appointment_id:
          description: The unique identifier for the appointment
          allOf:
            - $ref: "#/components/schemas/Uuid"
        provider_id:
          description: The unique identifier for the provider
          allOf:
            - $ref: "#/components/schemas/Uuid"
        start_time:
          description: The UTC timestamp of the appointment start time
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        end_time:
          description: The UTC timestamp of the appointment end time
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        status:
          description: The status of the appointment
          type: string
          enum:
            - held
            - confirmed
            - canceled
            - completed
        appointment_type:
          description: "The location type of the appointment (telemedicine or in_person). Note: this is distinct from the therapy modality (Individual, Couples, etc.) which is captured in therapy_type."
          type: string
          enum:
            - telemedicine
            - in_person
        therapy_type:
          description: The therapy type the appointment is for
          type: string
          enum:
            - individual
            - family
            - couples
            - psychiatric
      required:
        - appointment_id
        - provider_id
        - start_time
        - end_time
        - status
        - appointment_type
        - therapy_type
      additionalProperties: false
    Uuid:

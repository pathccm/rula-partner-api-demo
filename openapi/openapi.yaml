openapi: 3.1.0
info:
  title: Rula Partner API
  version: 0.25.1
  description: >
    Rula's API for partners. This API is currently a WIP and may change at any time.

    Updates:

    v0.25.1
      Changelog:
        + Added specialization value: first_responders
        + Added language value: suzhou
        + Marked deprecated specialization values (chronic_impulsivity, chronic_relapse, drug_abuse, impulsivity, job_stress, legal_stress, military_and_veterans, racial_trauma), race value (other), and language values (not_listed, other)
        + Deprecated values will remain accepted but are no longer supported for filtering

    v0.25.0
      Changelog:
        + Added stricter validation to POST /v1/patients so that providing EAP info not needed for an EAP referral will error (e.g. providing number_of_authorized_sessions for EAP that is not session limited)

    v0.24.1
      Changelog:
        + Added optional `guardian_type` field to guardian object on POST /v1/patients (enum: parent | medical, defaults to parent)

    v0.24.0
      Changelog:
        + Standardized POST /v1/providers/search filter enum values to short lowercase keys for gender, race, language, specialization, and modality (e.g. "female" instead of "Female", "cognitive_behavioral" instead of "Cognitive Behavioral (CBT)")
        + Added genders, races, languages, specializations, and modalities to GET /v1/providers/{uuid} response

    v0.23.5
      Changelog:
        + Changed POST /v1/patients response for identification and insurance validation failures from 502 to 422

    v0.23.4
      Changelog:
        + Additional clarification on start_time_range description on GET /v1/providers/slots
        + GET /v1/providers/slots no longer allows a start in start_time_range outside of bookable range
        + I.E. less than 25 hours from now

    v0.23.3
      Changelog:
        + Fixed is_eap_referral conditional validation to allow true when is_self_pay is not provided
        + Added custom error messages for if conditional failures for PatientCreateRequest

    v0.23.2
      Changelog:
        + Clarified start_time_range description on GET /v1/providers/slots
        + Improved descriptions across multiple fields for clarity
        + Added minItems/maxItems: 2 constraint to start_time_range on GET /v1/providers/slots

    v0.23.1
      Changelog:
        + Removed request-start-time header parameter from spec (now handled at the gateway level)

    v0.23.0
      Changelog:
        + Added optional is_self_pay boolean field to PatientCreateRequest (default: false)
        + insurance_id is now only required when is_self_pay is false
        + subscriber_id is now only required when is_eap_referral is false and is_self_pay is false
        + is_eap_referral must be false when is_self_pay is true

    v0.22.0
      Changelog:
        + Added PUT /v1/appointments/{uuid}/cancel endpoint to cancel an appointment

    v0.21.1
      Changelog:
        + Added request-start-time as an accepted optional header on all endpoints

    v0.21.0
      Changelog:
        + Added GET /v1/appointments/{uuid} endpoint to retrieve a single appointment
        + Extracted shared Appointment schema used by PatientAppointmentsResponse and AppointmentShowResponse

    v0.20.1
      Changelog:
        + Add upcoming_insurance as an optional parameter in employee_assistance_program

    v0.20.0
      Changelog:
        + Clarified that subscriber_id is required for POST /v1/patients when is_eap_referral is false
        + Added conditional schema validation to enforce subscriber_id when is_eap_referral is false

    v0.19.0
      Changelog:
        + The email and phone_number of a minor patient must now match their guardian's for POST /v1/patients
        + Updated description of email and phone_number fields for POST /v1/patients to reflect this

    v0.18.0
      Changelog:
        + Added willing_to_see to GET /v1/providers/{uuid} response
        + Standardized willing_to_see enum values to short lowercase keys across all endpoints
          (e.g., "Minors (13-17)" → "minors", "Children (5-7)" → "children")

    v0.17.0
      Changelog:
        + Added environment-specific OAuth scopes (partner_api:production, partner_api:staging).
          All tokens must now include the scope matching the target environment in addition to
          the endpoint's functional scope(s).

    v0.16.0
      Changelog:
        + Renamed carrier_uuid to id in GET /v1/insurances response

    v0.15.1
      Changelog:
        + Adds traced_id to BadGatewayError

    v0.15.0
      Changelog:
        + Updated GET /v1/insurances endpoint. Added carrier_uuid to response and optional state filter parameter.
        + Updated POST /v1/patients endpoint to take insurance_id instead of insurance.

    v0.14.5
      Changelog:
        + Added active_states to GET /v1/providers/{uuid} response

    v0.14.4
      Changelog:
        + Explicitly add minLength: 1 to required string fields in POST /v1/patients
        + Add pattern for location and address.state for POST /v1/patients

    v0.14.3
      Changelog:
        + Malformed JSON request bodies now return 400 instead of 500

    v0.14.2
      Changelog:
        + Added trace_id to InternalServerError (500) error responses

    v0.14.1
      Changelog:
        - Removed deprecated specialty enum values: Adolescents/Teens, Children, Dual Diagnosis, Emotional Disturbance, Life Coaching, Marital/Pre-marital, Sexual Orientation, Teen Violence
        - Removed deprecated modality enum values: Eclectic, Integrative

    v0.14.0
      Changelog:
        + Made first_name, last_name, email, and phone_number required fields within the guardian object on POST /v1/patients

    v0.13.1
      Changelog:
        + Updated descriptions for /v1/providers/search availability fields
        + Updated /v1/providers/search to return 422 with proper message when conflicting availability parameters are provided.

    v0.13.0
      Changelog:
        + Added RequestValidationError as a possible schema for 422 response on POST /v1/patients (in addition to UnprocessableEntityError)

    v0.12.0
      Changelog:
        + Added 404 as a possible response for GET /v1/patients/{uuid}/appointments (Patient not found)
        + Added 401 as a possible response for GET /v1/patients/{uuid}/appointments (Unauthorized)

    v0.11.0
      Changelog:
        + Added 422 as a possible response for POST /v1/patients (Unprocessable Entity for business logic validation failures)
        + Added 502 as a possible response for POST /v1/patients (Bad Gateway for external service failures)
        + Removed 403 as a possible response for POST /v1/patients (replaced by 422 for validation failures)
        + Removed unused error schema for ForbiddenError

    v0.10.0
      Changelog:
        + Added 422 Unprocessable Entity as a possible response for all endpoints with request validation

    v0.9.0
      Changelog:
        + Added 404, 406, 409, and 422 as possible responses for appointmentsCreate

    v0.8.0
      Changelog:
        + Made location_type a required parameter for GET /v1/providers/slots
        + Added uniqueItems constraint to location_type parameter for GET /v1/providers/slots
        + Added minItems: 1 constraint to location_type parameter for GET /v1/providers/slots
        + Added style: form and explode: true to location_type parameter for GET /v1/providers/slots to explicitly specify repeated query parameter format (location_type=a&location_type=b)

    v0.7.0
      Changelog:
        + Added 403 as a possible response for patientCreate

    v.0.6.1
      Changelog:
        + Adds a default value for the care_category field in ProvidersSearchRequest

    v0.6.0
      Changelog:
        + Corrected spelling of therapy_type as a required param for PatientAppointmentsResponse

    v0.5.4
      Changelog:
        + Updated the staging URL to match the actual deployed staging URL

    v0.5.3
      Changelog:
        + Commented out the production and local servers to work with downstream CI/CD pipeline. URLs are still in process of being generated/confirmed.

    v0.5.2
      Changelog:
        + Adds error responses to endpoints, including 400 Bad Request and 500 Internal Server Error.

    v0.5.1
      Changelog:
        + Added coverage_type to ProvidersSearchRequest

    v0.5.0
      Updated operational version for partners.
      Rula will adopt the following versioning until v1.0:
        + Breaking changes (ie: Adding a required field to a request) will be considered a minor version bump (ie: 0.5.0 -> 0.6.0)
          + During development, we will do our best to limit these and provide adequate notification
        + Non-breaking changes (ie: adding a field to a response, or adding an optional field to a request) will be considered a patch version bump (ie: 0.5.0 -> 0.5.1)
      Planned changes:
        + Server URLs are still proposed, actual URLs will be known once infra is in place, at which time they will be replaced with the full URLs.
        + Error codes and responses will be added as dependent service requirements are translated
      Changelog:
        + Removed partner_name as a parameter for PatientCreateRequest
        + Added a new required parameter care_types to PatientCreateRequest
        + Updated employee_assistance_program to require authorization_number for PatientCreateRequest

    v0.4.0
      Initial operational version for partners.
      This is the first managed release that will follow semver.
      Rula will adopt the following versioning until v1.0:
        + Breaking changes (ie: Adding a required field to a request) will be considered a minor version bump (ie: 0.4.0 -> 0.5.0)
          + During development, we will do our best to limit these and provide adequate notification
        + Non-breaking changes (ie: adding a field to a response, or adding an optional field to a request) will be considered a patch version bump (ie: 0.4.0 -> 0.4.1)
      Planned changes:
        + Server URLs are still proposed, actual URLs will be known once infra is in place, at which time they will be replaced with the full URLs.
        + Error codes and responses will be added as dependent service requirements are translated
      Changelog:
        + Changed API spec management - This will result in a significantly different structure/layout than previous versions, and additional changes that may not be noted below
        + Added the live production OAuth2 security scheme information
        + Added providersSlots
        + Removed appointmentsShow (not slated for initial release)
        + Removed appointmentUpdate (not slated for initial release)
        + Removed appointmentCancel (not slated for initial release)
        + Removed eventNotificationShow (not slated for initial release)
        + Removed patientShow (not slated for initial release)
        + Removed aptientSurveysIndex (not slated for initial release)

servers:
  # - url: https://api.prod.rula.com/edge/partner-scheduling-api-prod
  #   description: The proposed production API URL
  #   x-internal: false
  - url: https://api.prod.rula.com/edge/partner-scheduling-api-server-staging
    description: The staging API URL
    x-internal: false
  # - url: http://localhost:3000
  #   description: Local development URL
  #   x-internal: true
tags: []

paths:
  /v1/insurances:
    get:
      operationId: insurancesIndex
      summary: List of insurances Rula accepts
      description: >
        Returns a list of insurance carriers accepted by Rula, optionally filtered by state.
        Each insurance entry includes the carrier display name, network name, state, coverage type,
        and a unique id that can be used to reference the carrier in other API calls.
      security:
        - auth0:
            - partner_api:insurances:read
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z]{2}$
          in: query
          name: state
          required: false
          description: >
            Two-letter state code (e.g. CA, NY) to filter insurances by state.
            If omitted, insurances for all states are returned.
      responses:
        "200":
          $ref: "#/components/responses/InsurancesIndexResponse"
        "401":
          description: Unauthorized, invalid or expired token
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/providers/{uuid}:
    get:
      operationId: providersShow
      summary: Information for a specific provider.
      security:
        - auth0:
            - partner_api:providers:read
      parameters:
        - schema:
            $ref: "#/components/schemas/Uuid"
          example: 9c823227-dbe1-408c-9e71-0685817e3410
          in: path
          name: uuid
          required: true
          description: The uuid of the provider to retrieve
      responses:
        "200":
          $ref: "#/components/responses/ProvidersShowResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/providers/search:
    post:
      operationId: providersSearch
      summary: Search for providers matching criteria, returns summary information.
      security:
        - auth0:
            - partner_api:providers:read
      requestBody:
        $ref: "#/components/requestBodies/ProvidersSearchRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProvidersSearchResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/providers/slots:
    get:
      operationId: providersSlots
      summary: Available slots for a specific provider.
      security:
        - auth0:
            - partner_api:providers:read
      parameters:
        - schema:
            $ref: "#/components/schemas/Uuid"
          in: query
          name: provider_uuid
          required: true
          description: The unique Rula-provided identifier for the provider.
        - schema:
            type: string
            pattern: ^[A-Z]{2}$
            maxLength: 2
          in: query
          name: two_letter_state
          required: true
          description: Two-letter state code (e.g., "CA" for California).
        - schema:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              format: date-time
          in: query
          name: start_time_range
          required: false
          description: A [start, end] pair of ISO 8601 datetime strings defining the window to fetch slots within. The first element is the start (inclusive) and the second is the end (inclusive). Filters by slot start time. When omitted, defaults to 25 hours from now through 28 days out. No maximum window is enforced, but start cannot be less than 25 hours from now, as this is outside of the bookable range.
        - schema:
            type: array
            uniqueItems: true
            minItems: 1
            items:
              type: string
              enum:
                - in_person
                - telemedicine
          in: query
          name: location_type
          required: true
          style: form
          explode: true
          description: Array of location types to filter appointment slots by (in-person vs virtual).
      responses:
        "200":
          $ref: "#/components/responses/ProvidersSlotsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/patients:
    post:
      operationId: patientCreate
      summary: Creates a patient for Rula
      security:
        - auth0:
            - partner_api:patients:create
      description: Creates a patient for Rula
      requestBody:
        $ref: "#/components/requestBodies/PatientCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/PatientCreateResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "422":
          description: Unprocessable Entity - Business logic validation failure (e.g., EAP with psychiatry not supported, patient is a minor, patient could not be created for some other reason)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RequestValidationError"
                  - $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/patients/{uuid}/appointments:
    get:
      operationId: patientAppointments
      summary: Information for a specific patient's appointments.
      security:
        - auth0:
            - partner_api:appointments:read
      parameters:
        - schema:
            $ref: "#/components/schemas/Uuid"
          example: 9c823227-dbe1-408c-9e71-0685817e3410
          in: path
          name: uuid
          required: true
          description: The uuid of the patient to retrieve appointments for
      responses:
        "200":
          $ref: "#/components/responses/PatientAppointmentsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "404":
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/appointments/{uuid}:
    get:
      operationId: appointmentsShow
      summary: Retrieve info for an existing appointment
      security:
        - auth0:
            - partner_api:appointments:read
      parameters:
        - schema:
            $ref: "#/components/schemas/Uuid"
          example: 9c823227-dbe1-408c-9e71-0685817e3410
          in: path
          name: uuid
          required: true
          description: The uuid of the appointment to retrieve
      responses:
        "200":
          $ref: "#/components/responses/AppointmentShowResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "404":
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/appointments/{uuid}/cancel:
    put:
      operationId: appointmentsCancel
      summary: Cancel an existing appointment
      security:
        - auth0:
            - partner_api:appointments:create
      parameters:
        - schema:
            $ref: "#/components/schemas/Uuid"
          example: 9c823227-dbe1-408c-9e71-0685817e3410
          in: path
          name: uuid
          required: true
          description: The uuid of the appointment to cancel
      requestBody:
        $ref: "#/components/requestBodies/AppointmentCancelRequest"
      responses:
        "200":
          $ref: "#/components/responses/AppointmentShowResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "404":
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RequestValidationError"
                  - $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v1/appointments:
    post:
      operationId: appointmentsCreate
      summary: Create an appointment
      security:
        - auth0:
            - partner_api:appointments:create
      requestBody:
        $ref: "#/components/requestBodies/AppointmentsCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AppointmentsCreateResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestValidationError"
        "401":
          description: Unauthorized, invalid or expired token
        "404":
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "406":
          description: Not Acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotAcceptableError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RequestValidationError"
                  - $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

components:
  requestBodies:
    AppointmentCancelRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              initiator:
                type: string
                description: Who initiated the cancellation. Currently only "patient" is supported.
                enum:
                  - patient
              cancellation_reason_text:
                type: string
                minLength: 1
                description: Freeform text detailing why the appointment was cancelled.
            required:
              - initiator
              - cancellation_reason_text
    AppointmentsCreateRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              patient_id:
                description: The uuid of the patient
                allOf:
                  - $ref: "#/components/schemas/Uuid"
              provider_id:
                description: The uuid of the provider
                allOf:
                  - $ref: "#/components/schemas/Uuid"
              appointment_slot:
                description: The start time of the slot to book, as returned by GET /v1/providers/slots (start_time_iso). Must be in UTC.
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              appointment_details:
                type: object
                properties:
                  is_virtual:
                    description: Whether the appointment is in person or virtual
                    type: boolean
                  appointment_type:
                    description: The therapy modality of the appointment. Use "Individual", "Couples", or "Family" for therapy sessions. Use "Psychiatry" for psychiatric appointments. Use "15 min Consult" for brief initial consultations.
                    type: string
                    enum:
                      - Individual
                      - Couples
                      - Family
                      - 15 min Consult
                      - Psychiatry
                  two_letter_state:
                    description: The two letter state code where the appointment will take place
                    type: string
                    pattern: ^[A-Z]{2}$
                required:
                  - is_virtual
                  - appointment_type
                  - two_letter_state
            required:
              - patient_id
              - provider_id
              - appointment_slot
              - appointment_details
      required: true
    PatientCreateRequest:
      content:
        application/json:
          schema:
            type: object
            required:
              - partner_patient_id
              - first_name
              - last_name
              - phone_number
              - email
              - date_of_birth
              - location
              - care_types
              - is_eap_referral
            properties:
              partner_patient_id:
                type: string
                minLength: 1
                description: The patient's identifier in your system. Returned in the response so you can correlate Rula's patient_id with your own records.
              first_name:
                type: string
                minLength: 1
                description: The first name of the patient.
              last_name:
                type: string
                minLength: 1
                description: The last name of the patient.
              phone_number:
                type: string
                minLength: 1
                description: The phone number for the patient. Must be an SMS number. Must be identical to guardian's if minor
              email:
                type: string
                format: email
                description: The email for the patient. Must be identical to guardian's if minor
              date_of_birth:
                type: string
                format: date
                description: The patient's date of birth in ISO 8601 date format (YYYY-MM-DD).
              location:
                type: string
                pattern: ^[A-Z]{2}$
                description: The state the patient resides in
              insurance_id:
                type: string
                minLength: 1
                description: The carrier id of the insurance for the patient. Use the id field from GET /v1/insurances. Required when is_self_pay is false.
              subscriber_id:
                type: string
                minLength: 1
                description: The insurance member/subscriber ID. Required when both is_eap_referral and is_self_pay are false.
              sex_at_birth:
                type: string
                enum:
                  - Female
                  - Male
                description: The sex assigned at birth of the patient
              address:
                type: object
                properties:
                  is_home_address:
                    type: boolean
                    description: Is the address given the patient home address
                  street:
                    type: string
                    description: The address street of the patient
                  apt_suite:
                    type: string
                    description: The address apt suite of the patient
                  city:
                    type: string
                    description: The address city of the patient
                  state:
                    type: string
                    pattern: ^[A-Z]{2}$
                    description: The address state of the patient
                  zip_code:
                    type: string
                    description: The address zip code of the patient
              guardian:
                type: object
                description: Guardian information that is required if patient is a minor
                required:
                  - first_name
                  - last_name
                  - email
                  - phone_number
                properties:
                  first_name:
                    type: string
                    minLength: 1
                  last_name:
                    type: string
                    minLength: 1
                  email:
                    type: string
                    format: email
                  phone_number:
                    type: string
                    minLength: 1
                  guardian_type:
                    type: string
                    enum:
                      - parent
                      - medical
                    description: >
                      The type of guardianship. Defaults to `parent` if not provided.
                      `parent` — a biological or adoptive parent or legal guardian acting in a parental role.
                      `medical` — a person with medical decision-making authority who is not a parent (e.g. healthcare proxy, court-appointed medical guardian).
              care_types:
                type: array
                description: The types of care the patient is seeking. Determines what appointment types can be booked for this patient.
                items:
                  type: string
                  enum:
                    - Individual
                    - Couples
                    - Family
                    - Psychiatry
              is_self_pay:
                type: boolean
                default: false
                description: Whether the patient will use self-pay instead of insurance. When false, insurance_id is required.
              is_eap_referral:
                type: boolean
                description: Whether the patient is using an Employee Assistance Program (EAP). When false and is_self_pay is also false, subscriber_id is required.
              employee_assistance_program:
                type: object
                required:
                  - authorization_number
                properties:
                  authorization_number:
                    type: string
                    minLength: 1
                    description: The EAP authorization number
                  number_of_authorized_sessions:
                    type: integer
                    description: The remaining EAP authorized sessions required for session limited EAPs
                  authorized_session_expiry_date:
                    type: string
                    format: date
                    description: The expiration date of the EAP required for time limited EAPs
                  upcoming_insurance:
                    type: object
                    description: Optionally provide an insurance to be used after EAP is used up. Cannot be another EAP insurance.
                    required:
                      - insurance_id
                      - subscriber_id
                    properties:
                      insurance_id:
                        type: string
                        minLength: 1
                        description: The carrier id of the insurance for the patient
                      subscriber_id:
                        type: string
                        minLength: 1
                        description: Subscriber id of the insurance
            allOf:
              - if:
                  properties:
                    is_eap_referral:
                      const: false
                    is_self_pay:
                      const: false
                then:
                  required:
                    - subscriber_id
                errorMessage:
                  if: "Conditional failed. Must provide subscriber_id for non-EAP referral unless patient is self-pay"
              - if:
                  properties:
                    is_self_pay:
                      const: false
                then:
                  required:
                    - insurance_id
                errorMessage:
                  if: "Conditional failed. Must provide insurance_id if patient is not self-pay"
              - if:
                  required:
                    - is_self_pay
                  properties:
                    is_self_pay:
                      const: true
                then:
                  properties:
                    is_eap_referral:
                      const: false
                      errorMessage: "must be equal to false when using self-pay"
                errorMessage:
                  if: "Conditional failed. Patient cannot be an EAP referral if using self-pay"
      required: true

  securitySchemes:
    auth0:    # <---- arbitrary name
      type: oauth2
      description: >-
        This API uses OAuth 2 with the client credentials flow.
        In addition to the endpoint-specific functional scope(s), every token must include
        the environment scope matching the target environment:
        `partner_api:production` for production, or `partner_api:staging` for staging.
      flows:
        clientCredentials:
          tokenUrl: https://login.rula.com/oauth/token
          refreshUrl: https://login.rula.com/oauth/token
          scopes:
            partner_api:insurances:read: Read access to insurance data
            partner_api:providers:read: Read access to provider data
            partner_api:patients:create: Create new patients
            partner_api:appointments:read: Read access to appointments data
            partner_api:appointments:create: Create new appointments
            partner_api:production: Access to the production environment
            partner_api:staging: Access to the staging environment

  responses:
    AppointmentsCreateResponse:
      description: Default Response
      content:
        application/json:
          schema:
            type: object
            properties:
              appointment_id:
                type: string
              status:
                description: The booking status of the appointment. "held" is returned when an appointment is first created. "confirmed" indicates the appointment has been fully confirmed.
                type: string
                enum:
                  - confirmed
                  - held
            required:
              - appointment_id
              - status
            additionalProperties: false
    PatientCreateResponse:
      description: Default Response
      content:
        application/json:
          schema:
            type: object
            properties:
              patient_id:
                type: string
                description: The Rula-assigned UUID for the patient. Use this in subsequent API calls (e.g. POST /v1/appointments, GET /v1/patients/{uuid}/appointments).
              partner_patient_id:
                type: string
                description: The patient's identifier from your system, echoed back from the request.
            required:
              - patient_id
              - partner_patient_id
    AppointmentShowResponse:
      description: Appointment details retrieved successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Appointment"
    PatientAppointmentsResponse:
      description: Default Response
      content:
        application/json:
          schema:
            type: object
            properties:
              appointments:
                description: List of appointments belonging to the patient
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
            required:
              - appointments
            additionalProperties: false
    ProvidersSearchResponse:
      description: Default Response
      content:
        application/json:
          schema:
            type: object
            properties:
              providers:
                description: List of providers matching the search criteria
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: The unique identifier for the provider
                      allOf:
                        - $ref: "#/components/schemas/Uuid"
                    first_name:
                      description: The provider's first name
                      type: string
                    last_name:
                      description: The provider's last name
                      type: string
                    profile_image_url:
                      description: URL to the provider's profile image
                      type: string
                    profile_bio:
                      description: A brief biography of the provider
                      type: string
                    genders:
                      description: The genders the provider identifies with
                      type: array
                      items:
                        type: string
                    races:
                      description: The races or ethnicities the provider identifies with
                      type: array
                      items:
                        type: string
                    slot_start_time:
                      description: The start time of the provider's earliest available slot.
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  required:
                    - id
                    - first_name
                    - last_name
                  additionalProperties: false
            required:
              - providers
            additionalProperties: false
    InsurancesIndexResponse:
      description: Default Response
      content:
        application/json:
          schema:
            type: object
            properties:
              insurances:
                description: List of insurances Rula accepts
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: >
                        The unique identifier for the insurance carrier.
                        Use this to uniquely reference a specific carrier across API calls such as the POST /v1/patients endpoint.
                      type: string
                      example: 123e4567-e89b-12d3-a456-426614174000
                    carrier_display_name:
                      description: Human-readable name of the insurance carrier, suitable for displaying to end users.
                      type: string
                      example: Aetna
                    network_name:
                      description: >
                        The insurance network name. Use this value in the insurance field when searching for providers via POST /v1/providers/search. The value is case-insensitive.
                      type: string
                      example: aetna
                    state:
                      description: Two-letter state code indicating which state this insurance is accepted in.
                      type: string
                      pattern: ^[A-Z]{2}$
                      example: CA
                    coverage_type:
                      description: The type of insurance coverage.
                      type: string
                      enum:
                        - commercial
                        - eap
                        - HMO
                        - medicaid
                        - medicare_advantage
                        - medicare_ffs
                      example: commercial
                  required:
                    - id
                    - carrier_display_name
                    - network_name
                    - state
                    - coverage_type
                  additionalProperties: false
            required:
              - insurances
            additionalProperties: false
